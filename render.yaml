services:
  - type: web
    name: saakar-lms-backend
    env: docker
    dockerContext: backend
    dockerfilePath: backend/Dockerfile
    plan: free
    healthCheckPath: /docs
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: saakar-lms-db
          property: connectionString
      - key: AI_PROVIDER
        value: openai
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_BASE_URL
        value: https://api.openai.com/v1
      - key: OPENAI_LLM_MODEL
        value: gpt-4o-mini
      - key: OPENAI_EMBED_MODEL
        value: text-embedding-3-small
      - key: OPENAI_EMBED_DIMENSIONS
        value: 768
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: '["https://saakar-lms-frontend.netlify.app", "http://localhost"]'
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false

databases:
  - name: saakar-lms-db
    plan: free
